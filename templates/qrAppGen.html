<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR App</title>
    <link rel="icon" href="{{ url_for('static', filename='images.ico') }}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="../static/app.css">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='apple-touch-icon-120x120.png') }}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='apple-touch-icon-152x152.png') }}">
    <link rel="apple-touch-icon" sizes="167x167" href="{{ url_for('static', filename='apple-touch-icon-167x167.png') }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-bar">
        <a class="brand" href="/">
          <span>Basic-Fit</span>
          <small>QR App</small>
        </a>
        <div class="nav-links">
          <a href="/">Accueil</a>
          <a href="/history">Historique</a>
          <a href="/get_boisson_image">Boissons</a>
          <a href="/app">App</a>
        </div>
      </nav>
    </header>

    <main class="page">
      <section class="hero">
        <div>
          <h1>Generateur QR App</h1>
          <p>Entrez votre numero de carte et votre Device ID pour generer un QR code app instantane.</p>
        </div>
        <div class="card">
          <div class="input-row" style="margin-bottom: 10px;">
            <input type="text" id="cardNumberInput" class="input-field" placeholder="Numero de carte (ex: V00347833)" aria-label="Numero de carte">
          </div>
          <div class="input-row">
            <input type="text" id="deviceIdInput" class="input-field" placeholder="Device ID (ex: 8d20fc96-1b0e-4982-8292-e97caed114ec)" aria-label="Device ID">
            <button id="generateBtn" class="btn" type="button">Generer</button>
          </div>
        </div>
      </section>

      <section class="card qr-block" id="qrCodeContainer" style="display: none;">
        <h3>Votre QR code</h3>
        <p id="qrDataDisplay" style="word-break: break-all; font-size: 0.9em; color: #666; margin: 10px 0;">Données: <strong></strong></p>
        <img id="qrCodeImage" src="" alt="QR code app">
      </section>
    </main>

    <script>
      async function generateQRCodeApp() {
        const cardNumber = document.getElementById("cardNumberInput").value.trim();
        const deviceId = document.getElementById("deviceIdInput").value.trim();
        
        if (!cardNumber) {
          alert("Veuillez entrer un numero de carte");
          return;
        }
        if (!deviceId) {
          alert("Veuillez entrer un Device ID");
          return;
        }
        
        try {
          const response = await fetch("/generate_qr_app", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              card_number: cardNumber,
              device_id: deviceId
            })
          });
          
          if (!response.ok) {
            throw new Error("Erreur lors de la génération du QR code");
          }
          
          const data = await response.json();
          const qrString = data.qr_string;
          const qrUrl = data.qr_url;
          
          document.getElementById("qrDataDisplay").innerHTML = 
            `Données: <strong>${qrString}</strong>`;
          document.getElementById("qrCodeImage").src = qrUrl;
          document.getElementById("qrCodeContainer").style.display = "grid";
        } catch (error) {
          alert("Erreur: " + error.message);
          console.error("Erreur:", error);
        }
      }

      document.getElementById("generateBtn").addEventListener("click", generateQRCodeApp);
    </script>
  </body>
</html>
